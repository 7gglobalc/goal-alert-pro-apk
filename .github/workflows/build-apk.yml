name: Build & Release Debug APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "JAVA_HOME is: $JAVA_HOME"
          java -version
          JAVA_VER=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F '.' '{print $1}')
          echo "Detected Java major version: $JAVA_VER"
          if [ -z "$JAVA_VER" ]; then
            echo "Error: Java version could not be detected."
            exit 1
          fi
          if [ "$JAVA_VER" -lt 17 ]; then
            echo "Error: Java version is $JAVA_VER, but version 17 or newer is required."
            exit 1
          fi
          echo "Java environment verified successfully: version $JAVA_VER (>= 17)."

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists."
          else
            echo "debug.keystore not found. Generating temporary debug keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "Error: ./debug.keystore could not be found or created."
            exit 1
          fi
          echo "./debug.keystore is present and ready."

      - name: Build the debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Error: Exact debug APK not found at $APK_PATH"
            echo "Searching only inside app/build/outputs/apk for discovered APKs:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 3 -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -f "$APK_PATH" ]; then
            echo "Error: $APK_PATH is not a regular file."
            exit 1
          fi

          if [ ! -s "$APK_PATH" ]; then
            echo "Error: $APK_PATH is empty (0 bytes)."
            exit 1
          fi

          case "$APK_PATH" in
            *.apk) ;;
            *)
              echo "Error: $APK_PATH does not have .apk extension."
              exit 1
              ;;
          esac

          if [ "$APK_PATH" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "Error: APK path is not exactly app/build/outputs/apk/debug/app-debug.apk"
            exit 1
          fi

          echo "APK successfully verified at $APK_PATH (size: $(stat -c%s "$APK_PATH") bytes)."

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TMP_DIR=$(mktemp -d)
          cp app/build/outputs/apk/debug/app-debug.apk "$TMP_DIR/app-debug.apk"
          echo "asset_path=$TMP_DIR/app-debug.apk" >> $GITHUB_OUTPUT
          echo "Prepared release asset at $TMP_DIR/app-debug.apk"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          if ! command -v gh &> /dev/null; then
            echo "Error: GitHub CLI (gh) is not available."
            exit 1
          fi

          PREPARED_APK="${{ steps.prepare_asset.outputs.asset_path }}"

          if [ ! -f "$PREPARED_APK" ]; then
            echo "Error: Prepared APK does not exist at $PREPARED_APK"
            exit 1
          fi

          if [ ! -s "$PREPARED_APK" ]; then
            echo "Error: Prepared APK is empty (0 bytes)."
            exit 1
          fi

          case "$PREPARED_APK" in
            *.apk) ;;
            *)
              echo "Error: Prepared APK does not end in .apk"
              exit 1
              ;;
          esac

          FILENAME=$(basename "$PREPARED_APK")
          if [ "$FILENAME" != "app-debug.apk" ]; then
            echo "Error: Release asset filename is not exactly app-debug.apk (found: $FILENAME)"
            exit 1
          fi

          TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          NOTES=$(cat <<EOF
- This is an automatically generated debug APK.
- The APK was built by GitHub Actions.
- GitHub Actions run number: ${GITHUB_RUN_NUMBER}
- GitHub Actions run attempt: ${GITHUB_RUN_ATTEMPT}
- Source commit SHA: ${GITHUB_SHA}
- APK is intended for testing.
- APK is not a Play Store production release.
- APK is signed only with a temporary debug keystore.
EOF
          )

          echo "release_tag=$TAG" >> $GITHUB_ENV
          echo "release_title=$TITLE" >> $GITHUB_ENV

          echo "Creating GitHub Release with tag: $TAG, title: $TITLE"
          gh release create "$TAG" "$PREPARED_APK" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --target "${GITHUB_SHA}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_OUTCOME="${{ steps.publish_release.outcome }}"
          DIRECT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"

          if [ "$RELEASE_OUTCOME" = "success" ]; then
            echo "=== RELEASE SUCCESSFUL ==="
            TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
            TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
            gh release view "$TAG" || true

            echo "Release tag: $TAG"
            echo "Release title: $TITLE"
            echo "Release URL: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
            echo "APK filename: app-debug.apk"
            echo "Direct download URL: $DIRECT_URL"

            echo "### DIRECT APK DOWNLOAD" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "[$DIRECT_URL]($DIRECT_URL)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "The normal Actions artifact \`app-debug-apk\` remains available as a backup." >> $GITHUB_STEP_SUMMARY
          else
            echo "::warning ::Release publishing failed or was skipped."
            echo "The APK build succeeded and the normal Actions artifact \`app-debug-apk\` remains available."
            echo "Do not use the direct latest-release link until release publishing succeeds."
            echo "### BUILD STATUS: APK BUILT (RELEASE PENDING/FAILED)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "The Actions artifact \`app-debug-apk\` is available under the workflow run summary as a backup." >> $GITHUB_STEP_SUMMARY
          fi
